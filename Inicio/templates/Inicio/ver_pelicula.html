{% extends "base.html" %}
{% load static %}


{% block contenido %}
<h1>Detalle de Película</h1>

{% if pelicula.imagen %}
    <img src="{{ pelicula.imagen.url }}" width="300">
{% endif %}

<p><strong>Pelicula:</strong> {{ pelicula.pelicula }}</p>
<p><strong>Género:</strong> {{ pelicula.genero }}</p>
<p><strong>Año:</strong> {{ pelicula.anio}}</p>

<a href="{% url 'listado' %}">Volver al listado</a> 

{% endblock contenido %}
