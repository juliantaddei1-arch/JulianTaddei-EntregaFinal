{% extends "base.html" %}

{% block title_head %} Crear Película {% endblock title_head %}

{% block contenido %}
<h1>Crear nueva Película</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <h3>Datos de la Película</h3>
    {{ form_pelicula.as_p }}

    <h3>Imágenes</h3>
    {{ form_imagenes.as_p }}

    <button type="submit">Guardar</button>
</form>

{% endblock %}
