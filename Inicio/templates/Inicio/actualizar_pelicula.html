{% extends "base.html" %}

{% block contenido %}

<h1>Actualizar Película: {{ pelicula.pelicula }}</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form_pelicula.as_p }}
    
    <h3>Agregar nuevas imágenes</h3>
    {{ form_imagenes.as_p }}

    <button type="submit">Guardar cambios</button>
</form>

<h3>Imágenes actuales:</h3>
{% for img in pelicula.imagenes.all %}
    <img src="{{ img.imagen.url }}" width="200">
{% endfor %}

{% endblock %}
